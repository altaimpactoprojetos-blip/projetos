<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juan · Em breve</title>
<meta name="description" content="Em breve: conteúdos e eventos.">
<meta property="og:title" content="Juan · Em breve">
<meta property="og:description" content="Conteúdos e eventos.">
<meta property="og:image" content="https://juanbusiness.online/juan.jpg">
<meta name="theme-color" content="#ECECEC">
<style>
html,body{margin:0;height:100%}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;padding:24px 20px;box-sizing:border-box;
  background:#ECECEC;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;text-align:center;overflow:hidden}
.foto{position:relative;width:min(440px,86vw)}
.foto img{display:block;width:100%;height:auto;animation:flutua 6s ease-in-out infinite;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.foto::after{content:"";position:absolute;left:18%;right:18%;bottom:-14px;height:18px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.18),transparent);animation:sombra 6s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes sombra{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.85);opacity:.6}}
h1{margin:0;font-size:clamp(40px,9vw,80px);font-weight:800;letter-spacing:.02em;line-height:1}
p{margin:12px 0 0;font-size:clamp(14px,2.4vw,18px);font-weight:600;letter-spacing:.12em;color:#444}
@media (prefers-reduced-motion:reduce){.foto img,.foto::after{animation:none}}
</style>
</head>
<body>
<div class="foto"><img src="juan.png" alt="Juan" width="640" height="596"></div>
<div>
  <h1>EM BREVE</h1>
  <p>CONTEÚDOS E EVENTOS</p>
</div>
</body>
</html>
